name: Extract RallyOn source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract-source:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Extract RallyOn source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f rallyon.zip ]; then
            echo "rallyon.zip is already extracted. Nothing to do."
            exit 0
          fi

          mkdir -p .rallyon_extract
          unzip -q rallyon.zip -d .rallyon_extract
          cp -a .rallyon_extract/. .
          rm -rf .rallyon_extract rallyon.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract RallyOn source from uploaded archive"
          git push