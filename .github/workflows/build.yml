name: RallyOn Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Regression tests
        run: npm test

      - name: Check Edge Function types
        run: deno check --node-modules-dir=auto supabase/functions/sync-games/index.ts

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

  sports-sync-cron-migration:
    name: Isolated sports-sync Cron migration rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ^3

      - name: Start isolated local Supabase stack
        run: supabase --workdir validation/cron start

      - name: Execute actual Cron migration in rollback-only transaction
        run: bash scripts/validate-sports-sync-cron-migration.sh validation/cron

      - name: Stop isolated local Supabase stack
        if: always()
        run: supabase --workdir validation/cron stop
