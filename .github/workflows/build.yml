name: RallyOn Build Check

on:
  push:
    branches: [main, fix/p0-c-remediation-ci-base, fix/p0-auth-rls-review-remediation]
  pull_request:
    branches: [main, fix/p0-c-remediation-ci-base]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Regression tests
        run: npm test

      - name: Check Edge Function types
        run: deno check --node-modules-dir=auto supabase/functions/sync-games/index.ts

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

  exact-migration-validation:
    name: Exact PR #22 migrations on isolated local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        id: setup-supabase-cli
        uses: supabase/setup-cli@v3
        with:
          version: ^3

      - name: Stage exact root migration files
        run: |
          mkdir -p validation/supabase/migrations
          cp supabase/migrations/20261112120000_p0c_relational_favorite_teams.sql validation/supabase/migrations/20261112000300_p0c_relational_favorite_teams.sql
          cp supabase/migrations/20261112140000_p0_auth_rls_review_remediation.sql validation/supabase/migrations/20261112000400_p0_transactional_profile_favorites.sql

      - name: Start isolated local Supabase stack
        run: supabase --workdir validation start

      - name: Reset local database and apply exact PR #22 migrations
        run: supabase --workdir validation db reset

      - name: Verify profile contract, favorite backfill, RLS and RPC
        run: supabase --workdir validation db query --local --file supabase/verify.sql

      - name: Stop isolated local Supabase stack
        if: always() && steps.setup-supabase-cli.outcome == 'success'
        run: supabase --workdir validation stop
