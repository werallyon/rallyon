name: RallyOn Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Regression tests
        run: npm test

      - name: Check Edge Function types
        run: deno check --node-modules-dir=auto supabase/functions/sync-games/index.ts

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

  supabase-validation:
    name: Local Supabase database validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v3.stable

      - name: Start isolated local Supabase stack
        run: npm run supabase:validation:start

      - name: Reset local validation database
        run: npm run supabase:validation:reset

      - name: Verify P0-A / P0-C schema and fixtures
        run: npm run supabase:validation:verify

      - name: Stop local Supabase stack
        if: always()
        run: npm run supabase:validation:stop
