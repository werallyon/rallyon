name: RallyOn Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install

      - name: Regression tests
        run: npm test

      - name: Check Edge Function types
        run: deno check --node-modules-dir=auto supabase/functions/sync-games/index.ts

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build
